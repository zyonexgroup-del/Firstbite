<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F5B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fbAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6F7F0" />
    </linearGradient>
    <filter id="fbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#fbGrad)"/>

  <!-- Subtle inner border for depth -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- First Bite Food Cloche / Gourmet Icon -->
  <g fill="url(#fbAccent)" filter="url(#fbShadow)">
    <!-- Cloche Knob / Handle -->
    <circle cx="32" cy="18" r="3.5" />

    <!-- Cloche Dome -->
    <path d="M16 38 C16 26, 23 21, 32 21 C41 21, 48 26, 48 38 Z" />

    <!-- Cloche Base Tray / Platter -->
    <rect x="13" y="40" width="38" height="4" rx="2" />

    <!-- Steam Sparkle / Aroma Wave -->
    <circle cx="43" cy="16" r="1.5" fill="#FEF08A" opacity="0.9" />
    <circle cx="47" cy="20" r="1" fill="#FEF08A" opacity="0.8" />
  </g>
</svg>
